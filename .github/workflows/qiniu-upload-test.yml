name: Test Upload to Qiniu

# 运行前请在仓库 Settings → Secrets and variables → Actions 中配置：
# Required Secrets or Variables: QINIU_ACCESS_KEY, QINIU_SECRET_KEY, QINIU_BUCKET
# Optional Secrets or Variables: QINIU_REGION, QINIU_DOMAIN, QINIU_KEY_PREFIX
# Secrets take precedence when the same name exists in both places.
on:
  workflow_dispatch:
    inputs:
      object_key:
        description: '七牛对象 Key，留空则使用 <prefix>/<测试文件名>'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  upload:
    name: Upload a test file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY || vars.QINIU_ACCESS_KEY }}
      QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY || vars.QINIU_SECRET_KEY }}
      QINIU_BUCKET: ${{ secrets.QINIU_BUCKET || vars.QINIU_BUCKET }}
      QINIU_REGION: ${{ secrets.QINIU_REGION || vars.QINIU_REGION }}
      QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN || vars.QINIU_DOMAIN }}
      QINIU_KEY_PREFIX: ${{ secrets.QINIU_KEY_PREFIX || vars.QINIU_KEY_PREFIX || 'github-actions-test' }}
      QINIU_OBJECT_KEY: ${{ inputs.object_key || secrets.QINIU_OBJECT_KEY || vars.QINIU_OBJECT_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Qiniu Node.js SDK
        if: ${{ env.QINIU_ACCESS_KEY != '' }}
        run: npm install --no-save --no-package-lock --ignore-scripts qiniu@7.15.2

      - name: Create test file
        shell: bash
        run: |
          set -euo pipefail
          test_file="${RUNNER_TEMP}/qiniu-upload-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'StockBuddy Qiniu upload test\nrepository=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$test_file"
          echo "TEST_FILE=$test_file" >> "$GITHUB_ENV"

      - name: Upload test file to Qiniu Kodo
        if: ${{ env.QINIU_ACCESS_KEY != '' }}
        run: node .github/scripts/upload-to-qiniu.cjs "$TEST_FILE"
